name: Garden Agent Review

on:
  push:
    branches:
      - garden-background-agent
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm install
      - name: Commit generated package lock on review branch
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Update package lock for MCP client"
            git push origin HEAD:garden-background-agent
          fi
      - run: npm test
      - run: node --check garden_agent.js
      - run: node --check garden_mcp_client.js
      - run: node --check garden_sidecar_api.js
      - run: node --check garden_runtime.js
      - run: node --check railway_entry.js
